name: Build Calisthénie (iPhone + Android)

# À chaque push sur main : IPA non signée (FlareStore / SideStore) + APK, publiées dans une Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ios:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>)
        run: node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.ios.buildNumber='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Génère le projet iOS
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Installe les pods
        working-directory: ios
        run: pod install
      - name: Compile l'app (non signée)
        run: |
          PROJ=$(basename ios/*.xcworkspace .xcworkspace)
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          xcodebuild -workspace ios/$PROJ.xcworkspace -scheme $PROJ -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > xcodebuild.log 2>&1 || {
              grep -E "error:|\*\* BUILD FAILED" xcodebuild.log | sort -u | head -30 | while IFS= read -r l; do echo "::error::$l"; done
              tail -n 80 xcodebuild.log
              exit 1
            }
          tail -n 10 xcodebuild.log
      - name: Emballe l'IPA (à resigner avec FlareStore / SideStore)
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/$PROJ.app Payload/
          zip -qry calisthenie-unsigned.ipa Payload
          size=$(stat -f %z calisthenie-unsigned.ipa)
          echo "IPA : $size octets"
          if [ "$size" -lt 5000000 ]; then echo "::error::IPA anormalement petite"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: calisthenie-unsigned.ipa

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Numéro de version (1.0.<n° de build>)
        run: node -e "const f='app.json';const a=require('./'+f);a.expo.version='1.0.${{ github.run_number }}';a.expo.android.versionCode=${{ github.run_number }};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - name: Génère le projet Android
        run: npx expo prebuild --platform android --no-install --clean
      - name: Clé de signature fixe (pour mettre à jour par-dessus)
        run: cp keystore/calisthenie.keystore android/app/debug.keystore
      - name: Compile l'APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a > gradle.log 2>&1 || {
            msg=$(grep -E "^e: |error:|What went wrong|Execution failed" -A2 gradle.log | awk '!seen[$0]++' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
            tail -n 60 gradle.log
            exit 1
          }
          tail -n 10 gradle.log
      - run: cp android/app/build/outputs/apk/release/app-release.apk calisthenie-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: calisthenie-android.apk

  release:
    needs: [ios, android]
    if: ${{ always() && (needs.ios.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Notes de version (section « À venir » du CHANGELOG)
        run: |
          awk '/^## À venir/{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md
          [ -s notes.md ] || echo "Mise à jour" > notes.md
          { echo "## Calisthénie 1.0.${{ github.run_number }}"; echo; cat notes.md; echo; echo "---"; echo "iPhone : télécharge calisthenie-unsigned.ipa (appli GitHub, connecté) puis ouvre-la avec FlareStore ou SideStore."; echo "Android : installe calisthenie-android.apk."; } > body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Calisthénie 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: body.md
          fail_on_unmatched_files: false
          files: |
            calisthenie-unsigned.ipa
            calisthenie-android.apk
